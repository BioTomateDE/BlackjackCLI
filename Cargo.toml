[package]
name = "blackjack"
version = "1.3.0"
authors = ["BioTomateDE <latuskati+cratesio@gmail.com>"]
edition = "2024"
description = "A basic singleplayer Blackjack CLI"
readme = "README.md"
repository = "https://github.com/BioTomateDE/rust-blackjack"
license = "GPL-3.0-or-later"
keywords = ["blackjack", "gambling", "cli", "games"]
categories = ["games", "command-line-utilities"]

[dependencies.colored-print]
version = "0.1.2"

[dependencies.rand]
version = "0.10.0"
default-features = false
features = ["thread_rng"]
